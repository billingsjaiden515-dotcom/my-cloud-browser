<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Favicon wrapper for Brave.
       The source is public/icons/brave.png, extracted from Brave's own
       published favicon (https://brave.com/favicon.ico, a 3-image 16/24/32px
       ICO) and embedded losslessly as a data URI, so the tab icon is the REAL
       Brave lion and matches the dropdown logo exactly rather than being a
       hand-drawn approximation that could drift from it. -->
  <image href="data:image/png;base64," x="0" y="0" width="48" height="48"/>
</svg>
