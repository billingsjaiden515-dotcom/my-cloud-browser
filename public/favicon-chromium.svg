<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon wrapper for Chromium.
       The source art is public/icons/chromium.png (a 32x32 PNG), embedded
       losslessly as a data URI so the favicon matches the dropdown logo
       EXACTLY rather than being a separate, hand-drawn approximation that
       could drift from it. -->
  <image href="data:image/png;base64," x="0" y="0" width="32" height="32"/>
</svg>
